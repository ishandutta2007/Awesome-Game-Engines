<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d1a" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="30%" stop-color="#818cf8" />
      <stop offset="65%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Animated Accent Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4">
        <animate attributeName="stop-color" values="#06b6d4;#8b5cf6;#f43f5e;#06b6d4" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#6366f1">
        <animate attributeName="stop-color" values="#6366f1;#f43f5e;#06b6d4;#6366f1" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#f43f5e">
        <animate attributeName="stop-color" values="#f43f5e;#06b6d4;#8b5cf6;#f43f5e" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="glowLeft" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowRight" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.28" />
    </pattern>

    <style>
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #38bdf8; letter-spacing: 1.5px; text-transform: uppercase; }
      .main-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 52px; font-weight: 900; fill: url(#titleGrad); letter-spacing: -0.5px; }
      .sub-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 400; fill: #cbd5e1; letter-spacing: 0.5px; }
      .tag-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 500; fill: #e2e8f0; }

      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(2deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes beamMove {
        0% { transform: translateX(-1200px); }
        100% { transform: translateX(1200px); }
      }

      .floating-node-1 { animation: floatSlow 7s ease-in-out infinite; transform-origin: center; }
      .pulsing-glow { animation: pulseGlow 5s ease-in-out infinite; transform-origin: center; }
      .light-beam { animation: beamMove 4s linear infinite; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bgGrad)" rx="16" />

  <!-- Background Animated Radial Glows -->
  <rect width="1200" height="360" fill="url(#glowLeft)" class="pulsing-glow" />
  <rect width="1200" height="360" fill="url(#glowRight)" class="pulsing-glow" />

  <!-- Cyber Matrix Grid Overlay -->
  <rect width="1200" height="360" fill="url(#grid)" />

  <!-- Decorative Orbit Circles / Technical Backdrop Elements -->
  <g class="floating-node-1" opacity="0.35">
    <circle cx="150" cy="180" r="90" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="6 4" />
    <circle cx="150" cy="180" r="5" fill="#38bdf8" />
    <circle cx="1050" cy="170" r="110" fill="none" stroke="#ec4899" stroke-width="1" stroke-dasharray="8 6" />
    <circle cx="1050" cy="170" r="6" fill="#ec4899" />
  </g>

  <!-- Light Beam Sweep Across Top Border -->
  <g clip-path="url(#borderClip)">
    <line x1="0" y1="2" x2="1200" y2="2" stroke="url(#borderGrad)" stroke-width="3" />
    <g class="light-beam">
      <ellipse cx="0" cy="2" rx="140" ry="2.5" fill="#ffffff" opacity="0.8" />
    </g>
  </g>

  <!-- Header Badge Pill -->
  <g transform="translate(600, 52)">
    <rect x="-175" y="-15" width="350" height="30" rx="15" fill="#0f172a" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" />
    <circle cx="-150" cy="0" r="4" fill="#38bdf8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="-136" y="4.5" class="badge-text">🎮 CURATED ECOSYSTEM GUIDE • 2026</text>
  </g>

  <!-- Main Title (Strictly Foreground with drop shadow backing) -->
  <g transform="translate(600, 132)">
    <text text-anchor="middle" y="2" class="main-title" fill="#020617" opacity="0.6">Awesome Game Engines</text>
    <text text-anchor="middle" y="0" class="main-title">Awesome Game Engines</text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(600, 180)">
    <text text-anchor="middle" class="sub-title">2D/3D Editor Workflows • Cross-Platform Runtimes • Open-Source &amp; SaaS</text>
  </g>

  <!-- Engine Badges / Pills Bar -->
  <g transform="translate(600, 255)">
    <!-- Pill 1: Godot -->
    <g transform="translate(-460, 0)">
      <rect x="-42" y="-16" width="84" height="32" rx="16" fill="#1e293b" stroke="#478cbf" stroke-width="1.2" fill-opacity="0.75" />
      <text text-anchor="middle" y="5" class="tag-text">🤖 Godot</text>
    </g>
    <!-- Pill 2: Unreal Engine -->
    <g transform="translate(-350, 0)">
      <rect x="-56" y="-16" width="112" height="32" rx="16" fill="#1e293b" stroke="#313131" stroke-width="1.2" fill-opacity="0.75" />
      <text text-anchor="middle" y="5" class="tag-text">⚡ Unreal Engine</text>
    </g>
    <!-- Pill 3: Unity -->
    <g transform="translate(-235, 0)">
      <rect x="-44" y="-16" width="88" height="32" rx="16" fill="#1e293b" stroke="#222c37" stroke-width="1.2" fill-opacity="0.75" />
      <text text-anchor="middle" y="5" class="tag-text">🛠️ Unity</text>
    </g>
    <!-- Pill 4: Bevy -->
    <g transform="translate(-135, 0)">
      <rect x="-40" y="-16" width="80" height="32" rx="16" fill="#1e293b" stroke="#2e3440" stroke-width="1.2" fill-opacity="0.75" />
      <text text-anchor="middle" y="5" class="tag-text">🦀 Bevy</text>
    </g>
    <!-- Pill 5: PlayCanvas -->
    <g transform="translate(-25, 0)">
      <rect x="-55" y="-16" width="110" height="32" rx="16" fill="#1e293b" stroke="#e05d44" stroke-width="1.2" fill-opacity="0.75" />
      <text text-anchor="middle" y="5" class="tag-text">🌐 PlayCanvas</text>
    </g>
    <!-- Pill 6: Cocos -->
    <g transform="translate(90, 0)">
      <rect x="-44" y="-16" width="88" height="32" rx="16" fill="#1e293b" stroke="#1da1f2" stroke-width="1.2" fill-opacity="0.75" />
      <text text-anchor="middle" y="5" class="tag-text">🎯 Cocos</text>
    </g>
    <!-- Pill 7: Defold -->
    <g transform="translate(195, 0)">
      <rect x="-45" y="-16" width="90" height="32" rx="16" fill="#1e293b" stroke="#ff7640" stroke-width="1.2" fill-opacity="0.75" />
      <text text-anchor="middle" y="5" class="tag-text">📱 Defold</text>
    </g>
    <!-- Pill 8: Raylib -->
    <g transform="translate(295, 0)">
      <rect x="-42" y="-16" width="84" height="32" rx="16" fill="#1e293b" stroke="#f5f5f5" stroke-width="1.2" fill-opacity="0.75" />
      <text text-anchor="middle" y="5" class="tag-text">📐 Raylib</text>
    </g>
    <!-- Pill 9: libGDX -->
    <g transform="translate(395, 0)">
      <rect x="-44" y="-16" width="88" height="32" rx="16" fill="#1e293b" stroke="#e74c3c" stroke-width="1.2" fill-opacity="0.75" />
      <text text-anchor="middle" y="5" class="tag-text">☕ libGDX</text>
    </g>
    <!-- Pill 10: O3DE -->
    <g transform="translate(485, 0)">
      <rect x="-38" y="-16" width="76" height="32" rx="16" fill="#1e293b" stroke="#00b4d8" stroke-width="1.2" fill-opacity="0.75" />
      <text text-anchor="middle" y="5" class="tag-text">📦 O3DE</text>
    </g>
  </g>

  <!-- Bottom Glowing Accent Line with Running Beam -->
  <rect x="0" y="356" width="1200" height="4" fill="url(#borderGrad)" />
</svg>
